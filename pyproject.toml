[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-photo-system"
version = "0.3.0"
description = "Universal AI Product Photography Studio: generic architecture and independent analysis plugins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.4", "Pillow==12.2.0", "opencv-python-headless==4.13.0.92"]

[project.optional-dependencies]
vision = ["numpy==2.4.4", "opencv-python-headless==4.13.0.92"]
image-io = ["Pillow==12.2.0"]
segmentation = ["onnxruntime==1.30.0", "numpy==2.4.4", "Pillow==12.2.0", "opencv-python-headless==4.13.0.92"]

[project.scripts]
product-photo-check = "product_photo.environment:main"
product-photo-analyze = "product_photo.extract_structure:main"
product-studio-analyze = "product_studio.cli:main"
product-studio-segment = "product_studio.segmentation.cli:main"
product-studio = "product_studio.runtime:main"
product-studio-image-edit = "product_studio.providers.image_guided:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
product_studio = ["resources/*.json", "resources/platform_presets/*.json"]

